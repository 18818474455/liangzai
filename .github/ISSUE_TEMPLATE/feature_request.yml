name: 功能建议
description: 用真实活动摄影工作流描述希望解决的问题
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么类型的活动、多少照片、什么设备、需要在多长时间内完成？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的问题
      description: 请描述阻碍，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: 当前替代流程
      description: 目前如何完成？时间或质量成本是什么？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 理想结果
      description: 完成后如何判断它真正解决了问题？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 可能涉及的范围
      options:
        - 桌面产品
        - liangzai-cube-kit
        - liangzai-plugin-sdk
        - 文档与教程
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有上传未经授权的人像、客户资料、账号或授权文件。
          required: true
