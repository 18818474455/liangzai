name: Bug 报告
description: 报告可以稳定复现的桌面应用、下载或文档问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传客户原片、账号、License、访问令牌或未经授权的人像。安全与隐私问题请按照 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本与 build
      description: 例如 0.1.19 build 27
      placeholder: 0.1.19 build 27
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS · Apple Silicon
        - Windows · x64
        - GitHub 文档或下载
        - 开源组件
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与硬件
      description: 操作系统版本、芯片或 CPU、显卡等
      placeholder: macOS 15.x / M2 / 16 GB
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最短复现步骤
      placeholder: |
        1. 打开……
        2. 导入……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可公开的截图或日志
      description: 请先移除图片、路径、账号和授权信息中的私人数据
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我使用的是当前支持的平台，并已查看现有 Issue。
          required: true
        - label: 本报告不包含客户照片、密钥、License 或其他私人数据。
          required: true
